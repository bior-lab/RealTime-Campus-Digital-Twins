name: Update market snapshot

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: campus-dt-market-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out website
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Update EMC/NEMS market record
        run: python tools/update_market_snapshot.py

      - name: Commit updated record
        shell: bash
        run: |
          if git diff --quiet -- data/market-snapshot.json; then
            echo "The published market record has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-snapshot.json
          git commit -m "chore: update market snapshot"
          git push origin HEAD:main
